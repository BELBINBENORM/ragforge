services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: ai_knowledge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_knowledge"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/ai_knowledge
      OLLAMA_MODEL: llama3.2
      OLLAMA_HOST: http://host.docker.internal:11434
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - documents_data:/app/data/documents
      - logs_data:/app/logs

volumes:
  postgres_data:
  documents_data:
  logs_data:
